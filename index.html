<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kepez Namaz Vakitleri</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 10px;
    }
    .current-clock {
      font-size: 1.8rem;
      font-weight: bold;
      color: #00b4d8;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    .city {
      font-size: 0.9rem;
      font-weight: 500;
      color: #aaa;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 100%;
      max-width: 280px;
    }
    .vakit-box {
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 6px 4px;
    }
    .vakit-isim {
      font-size: 0.75rem;
      color: #888;
    }
    .vakit-saat {
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 2px;
    }
    .loading {
      font-size: 0.9rem;
      color: #f39c12;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- En üstte anlık dijital saat -->
  <div id="clock" class="current-clock">00:00:00</div>
  <div class="city">Antalya / Kepez</div>

  <div id="content" class="loading">Vakitler yükleniyor...</div>

  <script>
    // Anlık saati güncelleyen fonksiyon (Her 1 saniyede bir çalışır)
    function saatiGuncelle() {
      const simdi = new Date();
      const saat = String(simdi.getHours()).padStart(2, '0');
      const dakika = String(simdi.getMinutes()).padStart(2, '0');
      const saniye = String(simdi.getSeconds()).padStart(2, '0');
      document.getElementById('clock').innerText = `${saat}:${dakika}:${saniye}`;
    }

    // Namaz vakitlerini API'den çeken fonksiyon
    async function vakitleriGetir() {
      try {
        const response = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Antalya&country=Turkey&method=13');
        const data = await response.json();
        
        if (data.code === 200) {
          const t = data.data.timings;
          
          const vakitler = [
            { isim: 'İmsak', saat: t.Imsak },
            { isim: 'Güneş', saat: t.Sunrise },
            { isim: 'Öğle', saat: t.Dhuhr },
            { isim: 'İkindi', saat: t.Asr },
            { isim: 'Akşam', saat: t.Maghrib },
            { isim: 'Yatsı', saat: t.Isha }
          ];

          let html = '<div class="grid">';
          vakitler.forEach(v => {
            html += `
              <div class="vakit-box">
                <div class="vakit-isim">${v.isim}</div>
                <div class="vakit-saat">${v.saat}</div>
              </div>
            `;
          });
          html += '</div>';

          document.getElementById('content').innerHTML = html;
        } else {
          document.getElementById('content').innerHTML = 'Veri alınamadı.';
        }
      } catch (err) {
        document.getElementById('content').innerHTML = 'Bağlantı hatası!';
      }
    }

    // Saat için her 1 saniyede bir yenileme
    setInterval(saatiGuncelle, 1000);
    saatiGuncelle(); // İlk açılışta anında göstermesi için

    // Namaz vakitlerini bir kez yükle
    vakitleriGetir();
  </script>
</body>
</html>
