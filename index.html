<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Namaz Vakitleri</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 10px;
    }
    .current-clock {
      font-size: 2.2rem;
      font-weight: bold;
      color: #00b4d8;
      letter-spacing: 1px;
      line-height: 1;
    }
    /* Saatin altındaki küçük kalan süre yazısı */
    .kalan-sure {
      font-size: 0.85rem;
      color: #ff4d4d;
      font-weight: 500;
      margin-top: 4px;
      margin-bottom: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 100%;
      max-width: 280px;
    }
    .vakit-box {
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 6px 4px;
    }
    .vakit-box.next {
      background: #3a0000;
      border-color: #ff4d4d;
    }
    .vakit-box.next .vakit-isim {
      color: #ff9999;
    }
    .vakit-box.next .vakit-saat {
      color: #ff4d4d;
    }
    .vakit-isim {
      font-size: 0.75rem;
      color: #888;
    }
    .vakit-saat {
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 2px;
    }
    .loading {
      font-size: 0.9rem;
      color: #f39c12;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- En üstte anlık saat ve hemen altında kalan süre -->
  <div id="clock" class="current-clock">00:00</div>
  <div id="kalan-sure" class="kalan-sure"></div>

  <div id="content" class="loading">Vakitler yükleniyor...</div>

  <script>
    let globalVakitler = [];

    function saatiGuncelle() {
      const simdi = new Date();
      const saat = String(simdi.getHours()).padStart(2, '0');
      const dakika = String(simdi.getMinutes()).padStart(2, '0');
      document.getElementById('clock').innerText = `${saat}:${dakika}`;
      
      if (globalVakitler.length > 0) {
        yaklasanVaktiIsaretle();
      }
    }

    function yaklasanVaktiIsaretle() {
      const simdi = new Date();
      const mevcutDakika = simdi.getHours() * 60 + simdi.getMinutes();

      let yaklasanIndex = -1;
      let yaklasanDakika = 0;

      for (let i = 0; i < globalVakitler.length; i++) {
        const [h, m] = globalVakitler[i].saat.split(':').map(Number);
        const vakitDakika = h * 60 + m;

        if (vakitDakika > mevcutDakika) {
          yaklasanIndex = i;
          yaklasanDakika = vakitDakika;
          break;
        }
      }

      // Günün tüm vakitleri geçtiyse (Yatsıdan sonra) -> Ertesi günün İmsak vakti
      let farkDakika = 0;
      if (yaklasanIndex === -1) {
        yaklasanIndex = 0;
        const [h, m] = globalVakitler[0].saat.split(':').map(Number);
        const ertesiImsakDakika = (24 * 60) + (h * 60 + m);
        farkDakika = ertesiImsakDakika - mevcutDakika;
      } else {
        farkDakika = yaklasanDakika - mevcutDakika;
      }

      // Kalan süre metnini biçimlendir
      let kalanMetin = '';
      if (farkDakika <= 0) {
        kalanMetin = 'Vakit geldi';
      } else if (farkDakika < 60) {
        kalanMetin = `Kalan: ${farkDakika} dk`;
      } else {
        const saatFark = Math.floor(farkDakika / 60);
        const dkFark = farkDakika % 60;
        kalanMetin = `Kalan: ${saatFark} sa ${dkFark} dk`;
      }

      document.getElementById('kalan-sure').innerText = kalanMetin;

      // Kutuları güncelle
      const kutular = document.querySelectorAll('.vakit-box');
      kutular.forEach((kut) => kut.classList.remove('next'));
      if (kutular[yaklasanIndex]) {
        kutular[yaklasanIndex].classList.add('next');
      }
    }

    async function vakitleriGetir() {
      try {
        const response = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Antalya&country=Turkey&method=13');
        const data = await response.json();
        
        if (data.code === 200) {
          const t = data.data.timings;
          
          globalVakitler = [
            { isim: 'İmsak', saat: t.Imsak },
            { isim: 'Güneş', saat: t.Sunrise },
            { isim: 'Öğle', saat: t.Dhuhr },
            { isim: 'İkindi', saat: t.Asr },
            { isim: 'Akşam', saat: t.Maghrib },
            { isim: 'Yatsı', saat: t.Isha }
          ];

          let html = '<div class="grid">';
          globalVakitler.forEach(v => {
            html += `
              <div class="vakit-box">
                <div class="vakit-isim">${v.isim}</div>
                <div class="vakit-saat">${v.saat}</div>
              </div>
            `;
          });
          html += '</div>';

          document.getElementById('content').innerHTML = html;
          yaklasanVaktiIsaretle();
        } else {
          document.getElementById('content').innerHTML = 'Veri alınamadı.';
        }
      } catch (err) {
        document.getElementById('content').innerHTML = 'Bağlantı hatası!';
      }
    }

    setInterval(saatiGuncelle, 1000);
    saatiGuncelle();
    vakitleriGetir();
  </script>
</body>
</html>
